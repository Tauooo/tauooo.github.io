<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" role="img" aria-labelledby="title desc"><title id="title">RISC-V teaching operating system</title><desc id="desc">Conceptual layers of a Unix-like kernel, showing user programs, system calls, kernel subsystems and the RISC-V machine. Not a screenshot.</desc><rect width="660" height="400" fill="#203d31"/><g stroke="#a1c3a8" stroke-width=".6" opacity=".15"><path d="M0 40H660M0 80H660M0 120H660M0 160H660M0 200H660M0 240H660M0 280H660M0 320H660M0 360H660M60 0V400M120 0V400M180 0V400M240 0V400M300 0V400M360 0V400M420 0V400M480 0V400M540 0V400M600 0V400"/></g><g font-family="system-ui, sans-serif"><text x="45" y="39" font-size="12" fill="#d4e2d5" font-weight="650" letter-spacing="2.4">RV64  /  TEACHING KERNEL</text><rect x="44" y="60" width="572" height="58" rx="7" fill="#e9eee2"/><text x="63" y="83" font-size="10" font-weight="700" letter-spacing="1.2" fill="#527063">USER SPACE</text><text x="63" y="103" font-size="16" font-weight="600" fill="#203d31">User programs</text><text x="594" y="95" font-size="13" text-anchor="end" fill="#426453">Shell · applications</text><path d="M330 118V133" stroke="#bdd2bb" stroke-width="2"/><rect x="190" y="133" width="280" height="31" rx="4" fill="#bdd2bb"/><text x="330" y="153" font-size="13" text-anchor="middle" fill="#203d31" font-weight="600">System call interface</text><path d="M330 164V178" stroke="#bdd2bb" stroke-width="2"/><rect x="44" y="178" width="572" height="118" rx="7" fill="#2b4e3d" stroke="#799c83"/><text x="63" y="200" font-size="10" fill="#c4d9c5" font-weight="700" letter-spacing="1.4">KERNEL SPACE</text><g fill="#dbe8d9"><rect x="63" y="215" width="128" height="31" rx="4"/><rect x="198" y="215" width="128" height="31" rx="4"/><rect x="333" y="215" width="128" height="31" rx="4"/><rect x="468" y="215" width="129" height="31" rx="4"/></g><g fill="#203d31" font-size="12" text-anchor="middle" font-weight="600"><text x="127" y="235">Threads</text><text x="262" y="235">Virtual memory</text><text x="397" y="235">File systems</text><text x="532.5" y="235">Processes</text></g><rect x="63" y="253" width="534" height="28" rx="4" fill="#476953"/><text x="330" y="271" text-anchor="middle" font-size="12" fill="#f1f5ec">Device interfaces · Interrupts · Timers</text><path d="M330 296V311" stroke="#bdd2bb" stroke-width="2"/><rect x="44" y="311" width="572" height="47" rx="7" fill="#14291f" stroke="#799c83"/><text x="63" y="340" font-size="16" font-weight="650" fill="#e8eee2">RISC-V machine</text><text x="595" y="340" text-anchor="end" font-size="12" fill="#bdd2bb">QEMU virtual platform</text><text x="45" y="384" font-size="10" letter-spacing="1.2" fill="#c6d9c6">CONCEPTUAL SYSTEM STACK  ·  COURSE PROJECT SCOPE</text></g></svg>
